# herdr sidebar config for TACC Frontera.
#
# Install with:
#     mkdir -p ~/.config/herdr
#     cp scripts/frontera/config.frontera.toml ~/.config/herdr/config.toml
#
# or merge the [ui.sidebar.list] section into an existing config.toml.
#
# The `command` below points at the Frontera interpreter wrapper rather than at python
# directly. Frontera has no /usr/bin/python3.11; /usr/bin/python3 is 3.6.8 and cannot parse
# the provider. See scripts/frontera/herdr-jobs-frontera.sh for why the wrapper exists.
#
# NOTE: replace the absolute path below if your checkout is not at ~/herdr. Argv execution
# does no tilde expansion of its own, but herdr's config loader expands `~` before building
# the argv, so the `~/` form here is correct.

[ui.sidebar.list]
enabled = true
placement = "bottom"
collapsed = true
refresh_seconds = 10
timeout_seconds = 5
max_visible_rows = 12
command = ["~/herdr/scripts/frontera/herdr-jobs-frontera.sh", "--mode", "{mode}"]
modes = ["live", "history"]

columns = [
  { width = "fill", align = "left"  },
  { width = 3,      align = "right" },
  { width = 7,      align = "right" },
]

[ui.sidebar.list.styles]
ok = "#b8bb26"
fail = "#fb4934"
warn = "#fabd2f"
muted = "#928374"
normal = "#ebdbb2"

[[ui.sidebar.list.actions]]
id = "cancel"
label = "Cancel job"
command = ["scancel", "--", "{id}"]
confirm = "Cancel job {id} ({cell0})?"
validate = { id = "^[0-9]+(_[0-9]+)?(\\+[0-9]+)?$" }

[[ui.sidebar.list.actions]]
id = "tail"
label = "Tail log"
command = ["tail", "-f", "--", "{log}"]
target = "overlay"
cwd = "{dir}"
